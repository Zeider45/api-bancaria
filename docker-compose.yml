services:
  postgres:
    image: postgres:15
    container_name: sib_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sib_network

  redis:
    image: redis:7-alpine
    container_name: sib_redis
    ports:
      - "6379:6379"
    networks:
      - sib_network

  backend:
    build: ./backend
    container_name: sib_backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - sib_network

  celery_worker:
    build: ./backend
    container_name: sib_celery
    command: sh -c "python manage.py migrate && celery -A config.celery worker --loglevel=info"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - sib_network

  celery_beat:
    build: ./backend
    container_name: sib_celery_beat
    command: sh -c "python manage.py migrate && celery -A config.celery beat --loglevel=info"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - celery_worker
      - redis
      - postgres
    networks:
      - sib_network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    container_name: sib_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - sib_network

volumes:
  postgres_data:

networks:
  sib_network:
    driver: bridge